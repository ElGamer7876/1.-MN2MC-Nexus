name: Nexus unit tests

on:
  push:
    paths:
      - "mn2mc/nexus/**"
      - "tests/test_nexus.py"
      - ".github/workflows/nexus-tests.yml"
  pull_request:
    paths:
      - "mn2mc/nexus/**"
      - "tests/test_nexus.py"
      - ".github/workflows/nexus-tests.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest loguru
      - run: python -m pytest -q tests/test_nexus.py
