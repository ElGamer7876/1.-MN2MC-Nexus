name: Global / China edition selection
on:
  push:
    paths:
      - main.py
      - 'mn2mc/nexus/launcher.py'
      - 'mn2mc/nexus/editions.py'
      - 'mn2mc/nexus/bridge.py'
      - 'mn2mc/nexus/global_protocol.py'
      - 'mn2mc/mini/player.py'
      - 'mn2mc/config.py'
      - 'tests/test_nexus_editions.py'
      - 'tests/test_global_protocol.py'
      - 'tests/test_global_beta_regions.py'
      - 'mn2mc/nexus/regions.py'
      - '.github/workflows/edition-tests.yml'
  pull_request:
    paths:
      - main.py
      - 'mn2mc/nexus/launcher.py'
      - 'mn2mc/nexus/editions.py'
      - 'mn2mc/nexus/bridge.py'
      - 'mn2mc/nexus/global_protocol.py'
      - 'mn2mc/mini/player.py'
      - 'mn2mc/config.py'
      - 'tests/test_nexus_editions.py'
      - 'tests/test_global_protocol.py'
      - 'tests/test_global_beta_regions.py'
      - 'mn2mc/nexus/regions.py'
      - '.github/workflows/edition-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest pydantic PyYAML loguru
      - run: python -m pytest -q tests/test_nexus_editions.py tests/test_global_protocol.py tests/test_global_beta_regions.py
      - run: python main.py --dry-run
      - run: python main.py --mode both --dry-run
